name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Test
        run: go test ./...

  build-macos:
    needs: validate
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist release
          go build -trimpath -ldflags="-s -w" -o dist/cxq-darwin-${{ matrix.goarch }} .
          tar -czf release/codex-quest_${{ github.ref_name }}_darwin_${{ matrix.goarch }}.tar.gz -C dist cxq-darwin-${{ matrix.goarch }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-${{ matrix.goarch }}
          path: release/*

  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist release
          go build -trimpath -ldflags="-s -w" -o dist/cxq-linux-amd64 .
          tar -czf release/codex-quest_${{ github.ref_name }}_linux_amd64.tar.gz -C dist cxq-linux-amd64

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: release/*

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path dist, release
          go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/cxq-windows-amd64.exe .
          Compress-Archive -Path dist/cxq-windows-amd64.exe -DestinationPath release/codex-quest_${{ github.ref_name }}_windows_amd64.zip

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: release/*

  publish:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare checksums
        run: |
          mkdir -p release
          find artifacts -maxdepth 3 -type f -exec cp {} release/ \;
          cd release
          sha256sum -- * > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
